<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador - Plannit</title>

    <link rel="stylesheet" href="assets/css/(ian)planejador_rotina.css">
</head>

<body>

    <!-- ================= CABEÇALHO ================= -->

    <header>
        <div class="barra-info">

            <div class="logo">
                <img src="assets/images/Plannit_logo.png" alt="Logo">
            </div>

            <div class="titulo-pagina">
                <h2>Planejador</h2>
            </div>

            <nav class="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="(ian)funcionalidades.html">Planejador</a></li>
                    <li><a href="(João)bem_estar.html">Bem-Estar</a></li>
                    <li><a href="(Antonio)sobre.html">Sobre</a></li>
                    <li><a href="(Antonio)conta.html">Conta</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <!-- ================= CONTEÚDO ================= -->

    <main class="conteudo">

        <div class="app">

            <div class="btn titulo-app" onclick="openM('m2')">
                <h3 id="t">📚 Planejador de Estudos</h3>
            </div>

            <div class="row">

                <div class="dia active" onclick="selDia(this)">
                    M<br>19
                </div>

                <div class="dia" onclick="selDia(this)">
                    T<br>20
                </div>

                <div class="dia" onclick="selDia(this)">
                    W<br>21
                </div>

                <div class="dia" onclick="selDia(this)">
                    T<br>22
                </div>

                <div class="dia" onclick="selDia(this)">
                    F<br>23
                </div>

            </div>

            <div id="lista">

                <div class="card" onclick="tog(this)">
                    <span>📖 Reading</span>
                    <input type="checkbox" checked>
                </div>

                <div class="card" onclick="tog(this)">
                    <span>🏃 Running</span>
                    <input type="checkbox">
                </div>

            </div>

            <div class="progresso" onclick="openM('m5')">

                <span id="p-txt">
                    50% (1 de 2)
                </span>

                <div class="barra-bg">

                    <div class="barra-fill" id="b"></div>

                </div>

            </div>

            <button class="fab" onclick="openM('m6')">
                +
            </button>

        </div>

    </main>

    <!-- ================= MODAIS ================= -->

    <div id="m1" class="modal" onclick="closeM()">
        <div class="modal-in">
            <h3>Menu</h3>
            <p>👤 Perfil</p>
            <p>📊 Relatórios</p>
        </div>
    </div>

    <div id="m2" class="modal" onclick="closeM()">

        <div class="modal-in" onclick="event.stopPropagation()">

            <h3>Editar título</h3>

            <input
                id="i-t"
                value="Planejador de Estudos">

            <button onclick="savT()">
                Salvar
            </button>

        </div>

    </div>

    <div id="m5" class="modal" onclick="closeM()">

        <div class="modal-in">

            <h3>Histórico</h3>

            <div class="grafico">

                <div style="height:80%"></div>
                <div style="height:40%"></div>

            </div>

        </div>

    </div>

    <div id="m6" class="modal" onclick="closeM()">

        <div class="modal-in" onclick="event.stopPropagation()">

            <h3>Nova tarefa</h3>

            <input
                id="i-n"
                placeholder="Nome da tarefa">

            <button onclick="addT()">
                Criar
            </button>

        </div>

    </div>

    <div id="m7" class="modal" onclick="closeM()">

        <div class="modal-in">

            <h3>Configurações</h3>

            <label>

                <input type="checkbox" checked>

                Notificações

            </label>

        </div>

    </div>

    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const openM = id => {
            document.getElementById(id).style.display = "flex";
        }

        const closeM = () => {
            document.querySelectorAll(".modal").forEach(m => {
                m.style.display = "none";
            });
        }

        const selDia = d => {

            document.querySelectorAll(".dia")
                .forEach(x => x.classList.remove("active"));

            d.classList.add("active");

        }

        function tog(c){

            let i = c.querySelector("input");

            i.checked = !i.checked;

            c.querySelector("span")
                .classList.toggle("done", i.checked);

            up();

        }

        function up(){

            let t = document.querySelectorAll(".card input").length;

            let ok = document.querySelectorAll(".card input:checked").length;

            let p = t ? Math.round(ok / t * 100) : 0;

            document.getElementById("b").style.width = p + "%";

            document.getElementById("p-txt").innerText =
                `${p}% (${ok} de ${t})`;

        }

        function savT(){

            document.getElementById("t").innerHTML =
                "📚 " + document.getElementById("i-t").value;

            closeM();

        }

        function addT(){

            let n = document.getElementById("i-n").value;

            if(!n) return;

            document.getElementById("lista").insertAdjacentHTML(
                "beforeend",

                `<div class="card" onclick="tog(this)">
                    <span>📝 ${n}</span>
                    <input type="checkbox">
                </div>`

            );

            document.getElementById("i-n").value = "";

            closeM();

            up();

        }

        up();

    </script>

</body>

</html>
