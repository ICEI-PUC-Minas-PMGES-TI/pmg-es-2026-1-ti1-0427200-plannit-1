<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador de Rotina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-orange: #f97316;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e2e8f0; /* Fundo para contraste do simulador */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container do Smartphone */
        .app-container {
            width: 360px;
            height: 640px;
            background-color: var(--bg-color);
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            border: 8px solid #334155;
        }

        /* 1. Menu Lateral e Topo */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            font-size: 1.2rem;
        }

        /* 2. Título do Plano */
        .plan-title {
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .plan-title h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 3. Calendário Semanal */
        .calendar-strip {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 0 20px;
            margin-bottom: 25px;
        }

        .day-card {
            background: var(--card-bg);
            padding: 10px 5px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .day-card.active {
            border-color: var(--accent-orange);
        }

        .day-card span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .day-card strong {
            font-size: 1rem;
        }

        /* 4. Lista de Tarefas (Blocos) */
        .task-list {
            flex: 1;
            padding: 0 20px;
            overflow-y: auto;
        }

        .task-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--border-color);
        }

        .task-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-orange);
        }

        .task-info {
            flex: 1;
        }

        .task-info .line {
            height: 4px;
            background: var(--text-dim);
            border-radius: 2px;
            margin: 4px 0;
            width: 80%;
            opacity: 0.3;
        }

        .task-status {
            color: #22c55e;
        }

        /* 5. Barra de Progresso */
        .progress-section {
            padding: 20px;
        }

        .progress-bar-bg {
            height: 12px;
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 65%; /* Representando a porcentagem concluída */
            background: var(--accent-orange);
            border-radius: 6px;
        }

        /* 6. Botão Nova Tarefa (FAB) */
        .fab-button {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            background-color: var(--accent-orange);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            cursor: pointer;
            border: none;
            color: white;
        }

        /* 7. Navegação Inferior / Configurações */
        .bottom-nav {
            height: 60px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .bottom-nav i {
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .bottom-nav i.active {
            color: var(--text-main);
        }

        .notification-dot {
            position: relative;
        }
        .notification-dot::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background: var(--accent-orange);
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <i class="fa-solid fa-bars"></i>
            <div class="header-icons">
                <i class="fa-regular fa-clock"></i>
                <i class="fa-solid fa-gear"></i>
            </div>
        </header>

        <section class="plan-title">
            <h1>Título do Plano</h1>
            <p style="font-size: 0.8rem; color: var(--text-dim);">Segunda, 19 Abr 2025</p>
        </section>

        <section class="calendar-strip">
            <div class="day-card active"><span>M</span><strong>19</strong></div>
            <div class="day-card"><span>T</span><strong>29</strong></div>
            <div class="day-card"><span>W</span><strong>28</strong></div>
            <div class="day-card"><span>T</span><strong>25</strong></div>
            <div class="day-card"><span>F</span><strong>16</strong></div>
        </section>

        <main class="task-list">
            <div class="task-item">
                <div class="task-icon"><i class="fa-solid fa-book-open"></i></div>
                <div class="task-info">
                    <div class="line" style="width: 90%;"></div>
                    <div class="line" style="width: 60%;"></div>
                </div>
                <div class="task-status"><i class="fa-solid fa-circle-check"></i></div>
            </div>

            <div class="task-item">
                <div class="task-icon"><i class="fa-solid fa-person-running"></i></div>
                <div class="task-info">
                    <div class="line" style="width: 85%;"></div>
                    <div class="line" style="width: 40%;"></div>
                </div>
                <div class="task-status"><i class="fa-solid fa-circle-check"></i></div>
            </div>

            <div class="task-item">
                <div class="task-icon"><i class="fa-solid fa-utensils"></i></div>
                <div class="task-info">
                    <div class="line" style="width: 95%;"></div>
                    <div class="line" style="width: 50%;"></div>
                </div>
                <div class="task-status" style="color: var(--text-dim);"><i class="fa-solid fa-circle-xmark"></i></div>
            </div>
        </main>

        <section class="progress-section">
            <div class="progress-bar-bg">
                <div class="progress-fill"></div>
            </div>
        </section>

        <button class="fab-button">
            <i class="fa-solid fa-plus"></i>
        </button>

        <nav class="bottom-nav">
            <i class="fa-solid fa-house active"></i>
            <i class="fa-solid fa-calendar-days"></i>
            <i class="fa-solid fa-bell notification-dot"></i>
            <i class="fa-solid fa-gear"></i>
        </nav>
    </div>

</body>
</html>
