<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Plannit</title>
    <link rel="stylesheet" href="assets/css/cadastro.css">
</head>

<body>

    <header class="topbar">
        <div class="logo-container">
            <img src="assets/images/Plannit_logo.png" alt="Logo da Plannit">
            <h1>Plannit</h1>
        </div>
    </header>

    <main class="container">

        <h2>Crie sua conta</h2>

        <section class="card-cadastro">

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" min="1" required>
                </div>

                <div class="campo">
                    <label for="perfil">Você é estudante ou psicólogo?</label>
                    <select id="perfil" required>
                        <option value="">Selecione</option>
                        <option value="estudante">Estudante</option>
                        <option value="psicologo">Psicólogo</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="confirmar-email">Confirme seu e-mail</label>
                    <input type="email" id="confirmar-email" required>
                </div>

                <div class="campo">
                    <label for="senha">Crie sua senha</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="campo">
                    <label for="confirmar-senha">Confirme sua senha</label>
                    <input type="password" id="confirmar-senha" required>
                </div>

                <button type="submit">
                    Criar conta
                </button>

                <p>
                    Já possui conta?
                    <a href="login.html">Entrar</a>
                </p>

            </form>

        </section>

    </main>

    <script src="assets/js/cadastro.js"></script>

</body>

</html>
