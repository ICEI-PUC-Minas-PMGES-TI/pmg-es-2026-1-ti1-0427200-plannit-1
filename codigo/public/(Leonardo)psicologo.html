<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plannit - Área do Psicólogo</title>
  <link rel="stylesheet" href="assets/css/(Leonardo)psicologo.css">
</head>

<body>

  <!-- Componente Header Global -->
  <div id="header-plannit"></div>
  <script src="./assets/js/header.js"></script>

  <div class="container">

    <aside class="sidebar">
      <ul>
        <li class="menu-item active" data-page="consultas">Consultas</li>
        <li class="menu-item" data-page="agenda">Agenda</li>
        <li class="menu-item" data-page="perfil">Perfil</li>
      </ul>
    </aside>

    <main class="content">

      <!-- ABA CONSULTAS -->
      <section id="consultas" class="page active-page">
        <h2>Consultas</h2>
        <div class="filter-bar">
          <button class="filter-btn active" data-filtro="confirmada">Marcadas</button>
          <button class="filter-btn" data-filtro="cancelada">Canceladas</button>
          <button class="filter-btn" data-filtro="todas">Histórico</button>
        </div>
        <div id="listaConsultas"></div>
      </section>

      <!-- ABA AGENDA -->
      <section id="agenda" class="page">
        <h2>Agenda</h2>
        <div class="form-group-agenda">
          <label for="agendaData"><strong>Data:</strong></label>
          <input type="date" id="agendaData">
        </div>
        <div id="listaAgenda"></div>
      </section>

      <!-- ABA PERFIL -->
      <section id="perfil" class="page">
        <h2>Perfil</h2>
        <div class="card" id="perfilCard"></div>
      </section>

    </main>

  </div>

  <script src="assets/js/Leonardo(psicologo).js"></script>

</body>

</html>
