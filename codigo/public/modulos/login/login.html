<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plannit - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../../assets/css/login.css">
</head>

<body>
  <!-- Componente Header Global -->
  <div id="header-plannit"></div>
  <script src="../../assets/js/header.js"></script>

  <div id="login-container">
    <div class="login-card" id="login-row">
      <div id="login-column">
        <form id="login-form" onsubmit="return false;">
          <div class="login-header-text">
            <h3>Acesse sua Conta</h3>
            <p>Gerencie suas consultas e rotina no Plannit</p>
          </div>
          <div class="mb-3">
            <label for="loginInput" class="form-label-custom">Login</label>
            <input type="text" id="loginInput" class="form-control form-control-custom" placeholder="Digite seu usuário">
          </div>
          <div class="mb-4">
            <label for="senhaInput" class="form-label-custom">Senha</label>
            <input type="password" id="senhaInput" class="form-control form-control-custom" placeholder="Digite sua senha">
          </div>
          <div class="botoes-login">
            <button type="button" class="btn-registrar-custom" data-bs-toggle="modal" data-bs-target="#registerModal">Registrar</button>
            <button type="submit" id="btnLogin" class="btn-login-custom">Entrar ➔</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Registro -->
  <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="registerModalLabel">Novo Usuário</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="register-form" onsubmit="return false;">
            <div class="mb-3">
              <label for="txt_tipo" class="form-label">Tipo de Usuário</label>
              <select id="txt_tipo" class="form-select">
                <option value="cliente">Cliente</option>
                <option value="psicologo">Psicólogo</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="txt_login" class="form-label">Login</label>
              <input type="text" id="txt_login" class="form-control">
            </div>
            <div class="mb-3">
              <label for="txt_nome" class="form-label">Nome completo</label>
              <input type="text" id="txt_nome" class="form-control">
            </div>
            <div class="mb-3">
              <label for="txt_email" class="form-label">E-mail</label>
              <input type="email" id="txt_email" class="form-control">
            </div>
            <div class="mb-3">
              <label for="txt_senha" class="form-label">Senha</label>
              <input type="password" id="txt_senha" class="form-control">
            </div>
            <div class="mb-3">
              <label for="txt_senha2" class="form-label">Confirmação de Senha</label>
              <input type="password" id="txt_senha2" class="form-control">
            </div>
            <div id="campos_psicologo" style="display: none; border-top: 1px solid #dee2e6; padding-top: 15px; margin-top: 15px;">
              <h6 class="text-primary">Dados Profissionais</h6>
              <div class="mb-3">
                <label for="txt_crp" class="form-label">CRP</label>
                <input type="text" id="txt_crp" class="form-control" placeholder="Ex: 04/12345">
              </div>
              <div class="mb-3">
                <label for="txt_especialidade" class="form-label">Especialidade</label>
                <input type="text" id="txt_especialidade" class="form-control" placeholder="Ex: Ansiedade">
              </div>
              <div class="mb-3">
                <label for="txt_cidade" class="form-label">Cidade</label>
                <input type="text" id="txt_cidade" class="form-control" placeholder="Ex: Belo Horizonte">
              </div>
              <div class="mb-3">
                <label for="txt_tipoAtendimento" class="form-label">Tipo de Atendimento</label>
                <select id="txt_tipoAtendimento" class="form-select">
                  <option value="Online">Online</option>
                  <option value="Presencial">Presencial</option>
                  <option value="Ambos">Ambos</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="txt_telefone" class="form-label">Telefone</label>
                <input type="text" id="txt_telefone" class="form-control" placeholder="Ex: (31)99999-1111">
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="txt_valor" class="form-label">Valor da Consulta (R$)</label>
                  <input type="number" id="txt_valor" class="form-control" placeholder="120">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="txt_duracao" class="form-label">Duração (min)</label>
                  <input type="number" id="txt_duracao" class="form-control" placeholder="50">
                </div>
              </div>
              <div class="mb-3">
                <label for="txt_descricao" class="form-label">Descrição</label>
                <textarea id="txt_descricao" class="form-control" rows="2" placeholder="Breve descrição profissional"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn_salvar" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/login.js"></script>
</body>

</html>
