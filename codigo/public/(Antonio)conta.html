<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Minha Conta - Plannit</title>

    <link rel="stylesheet" href="assets/css/(Antonio)conta.css">
</head>

<body>

<header>
    <div class="barra-info">

        <div class="logo">
            <img src="assets/images/Plannit_logo.png" alt="Logo do site">
        </div>

        <div class="busca">
            <input type="text" placeholder="Buscar ferramentas...">
            <span class="icone-busca">🔍</span>
        </div>

        <nav class="menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="(ian)planejador_rotina.html">Planejador</a></li>
                <li><a href="(João)bem_estar.html">Bem-Estar</a></li>
                <li><a href="(Antonio)sobre.html">Sobre</a></li>
                <li><a href="(Antonio)conta.html">Conta</a></li>
            </ul>
        </nav>

    </div>
</header>

<main class="container">

    <aside class="sidebar">

        <div class="perfil-card">

            <div class="foto"></div>

            <h2 id="nomeUsuario">Usuário</h2>

            <p id="cursoUsuario"></p>

            <p id="idadeUsuario"></p>

            <p id="membroDesde"></p>

        </div>

        <div class="menu-lateral">

            <button onclick="mostrarConteudo('historico')">
                Histórico de conteúdos
            </button>

            <button onclick="mostrarConteudo('completas')">
                Atividades completas
            </button>

            <button onclick="mostrarConteudo('afazer')">
                Atividades a fazer
            </button>

            <button onclick="mostrarConteudo('favoritos')">
                Atividades frequentes/favoritas
            </button>

            <button onclick="mostrarConteudo('dificuldades')">
                Dificuldades
            </button>

            <button onclick="mostrarConteudo('psicologos')">
                Psicólogos recomendados
            </button>

            <button onclick="window.location.href='configuracoes.html'">
                Configurações
            </button>

        </div>

    </aside>

    <section class="conteudo">

        <div class="perfil-descricao">

            <h2>Perfil</h2>

            <p id="descricaoUsuario"></p>

        </div>

        <div class="area-conteudo" id="areaConteudo">

            <h3>Bem-vindo ao seu perfil!</h3>

            <p>
                Selecione uma opção no menu lateral para visualizar
                suas informações.
            </p>

        </div>

    </section>

</main>

<footer>
    © Copyright - 2026
</footer>

<script src="assets/js/(Antonio)conta.js"></script>

</body>
</html>
