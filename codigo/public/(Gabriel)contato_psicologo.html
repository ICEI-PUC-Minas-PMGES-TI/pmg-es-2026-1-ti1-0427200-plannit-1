<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plannit - Área do Cliente</title>
  <link rel="stylesheet" href="assets/css/cliente.css">
</head>

<body>

  <!-- Componente Header Global -->
  <div id="header-plannit"></div>
  <script src="./assets/js/header.js"></script>

  <div class="container">

    <aside class="sidebar">
      <ul>
        <li class="menu-item active" data-page="psicologos">Psicólogos</li>
        <li class="menu-item" data-page="consultas">Consultas</li>
        <li class="menu-item" data-page="perfil">Perfil</li>
      </ul>
    </aside>

    <main class="content">

      <!-- ABA PSICÓLOGOS -->
      <section id="psicologos" class="page active-page">
        <h2>Psicólogos Disponíveis</h2>
        <div class="cards" id="gridPsicologos">
          <!-- Renderizado via JS -->
        </div>
      </section>

      <!-- ABA CONSULTAS -->
      <section id="consultas" class="page">
        <h2>Minhas Consultas</h2>
        <div class="filter-bar">
          <button class="filter-btn active" data-filtro="confirmada">Marcadas</button>
          <button class="filter-btn" data-filtro="cancelada">Canceladas</button>
          <button class="filter-btn" data-filtro="todas">Histórico</button>
        </div>
        <div id="listaConsultas">
          <!-- Renderizado via JS -->
        </div>
      </section>

      <!-- ABA PERFIL -->
      <section id="perfil" class="page">
        <h2>Meu Perfil</h2>
        <div class="card" id="perfilCard">
          <!-- Renderizado via JS -->
        </div>
      </section>

    </main>

  </div>

  <!-- MODAL AGENDAMENTO -->
  <div class="modal" id="modalAgendamento">
    <div class="modal-content">
      <h2 id="modalTitulo">Agendar Consulta</h2>
      <p id="modalPsiInfo"></p>
      <div class="form-group">
        <label for="inputData">Data da consulta:</label>
        <input type="date" id="inputData">
      </div>
      <div id="slotsContainer">
        <!-- Slots 8h-17h renderizados via JS -->
      </div>
      <div class="modal-actions">
        <button class="btn-recusar" id="fecharModal">Fechar</button>
      </div>
    </div>
  </div>

  <script src="assets/js/cliente.js"></script>

</body>

</html>
