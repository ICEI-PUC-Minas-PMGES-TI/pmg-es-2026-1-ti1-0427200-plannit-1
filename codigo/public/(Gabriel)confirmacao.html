<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Agendamento</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#4ec391;
            display:flex;
            justify-content:center;
            padding:30px;
        }

        .container{
            background:#4f83c2;
            width:600px;
            padding:30px;
            border-radius:15px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        .secao{
            margin-bottom:25px;
        }

        .secao h2{
            margin-bottom:10px;
            color:#333;
        }

        .info{
            padding:12px;
            background:#f5f5f5;
            border-radius:8px;
            margin-bottom:10px;
        }

        .telefones{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .telefone{
            background:#f5f5f5;
            padding:10px 15px;
            border-radius:8px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-top:10px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:15px;
            border:none;
            border-radius:8px;
            background:#ff7b22;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#e96c18;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Confirmação de Agendamento</h1>

    <div class="secao">
        <h2>Paciente</h2>
        <div class="info" id="nomePaciente"></div>
    </div>

    <div class="secao">
        <h2>Psicólogo</h2>
        <div class="info" id="nomePsicologo"></div>
    </div>

    <div class="secao">
        <h2>Consulta</h2>
        <div class="info">
            <p><strong>Data:</strong> <span id="dataConsulta"></span></p>
            <p><strong>Horário:</strong> <span id="horarioConsulta"></span></p>
        </div>
    </div>

    <div class="secao">
        <h2>Telefones para contato</h2>

        <div class="telefones">
            <div class="telefone" id="telefone1"></div>
            <div class="telefone" id="telefone2"></div>
        </div>
    </div>

    <div class="secao">
        <h2>Digite seu celular</h2>

        <input
            type="tel"
            id="celular"
            placeholder="(31) 99999-9999"
        >
    </div>

    <button id="btnAgendar">
        Agendar
    </button>

</div>

<script src="assets/js/(Gabriel)confirmacao.js"></script>

</body>
</html>
